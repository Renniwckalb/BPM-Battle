<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e1e1e">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
    <title>BPM Battle</title>
</head>
<body>
    <!-- Sprite-->
    <svg style="display: none;" aria-hidden="true">
        <defs>
            <symbol id="icon-heart" viewBox="-1 -1 34 32">
                <path d="M23.5,0C20.9,0,18.4,1.6,17,4.1C15.6,1.6,13.1,0,10.4,0C4.6,0,0,4.6,0,10.4c0,8.1,12.9,15.2,16,18.5,c3.1-3.3,16-10.4,16-18.5C32,4.6,27.4,0,23.6,0z" stroke="red" stroke-width="1" fill="red"/>
            </symbol>

            <symbol id="icon-return" viewBox="0 0 24 24">
                <path d="M10 9V5l-7 7 7 7v-4.1c5 0 8.5 1.6 11 5.1-1-5-4-10-11-11z" fill="white"/>
            </symbol>
        </defs>
    </svg>
    <!-- Le Terrain de Jeu -->
    <canvas id="gameCanvas"></canvas>

    <!-- STATS ADVERSAIRE -->
    <div id="stats-p2" class="stats-container opponent-stats">
        <div class="hearts">
            <svg class="heart"><use href="#icon-heart"></use></svg>
            <svg class="heart"><use href="#icon-heart"></use></svg>
            <svg class="heart"><use href="#icon-heart"></use></svg>
            <span class="extra-hp" hidden>+0</span>
        </div>
        <div class="energy-text"><span data-i18n="energy">Énergie: </span><span id="energy-p2">0</span></div>
    </div>

    <!-- STATS JOUEUR -->
    <div id="stats-p1" class="stats-container player-stats">
        <div class="hearts">
            <svg class="heart"><use href="#icon-heart"></use></svg>
            <svg class="heart"><use href="#icon-heart"></use></svg>
            <svg class="heart"><use href="#icon-heart"></use></svg>
            <span class="extra-hp" hidden>+0</span>
        </div>
        <div class="energy-text"><span data-i18n="energy">Énergie: </span><span id="energy-p1">0</span></div>
    </div>

    <!-- BOUTONS D'ACTION -->
    <div id="ui-container">
        <button class="btn-action" data-action="mouvement" data-i18n="action_move">Déplacement</button>
        <button class="btn-action" data-action="recharge" data-i18n="action_charge">Recharge</button>
        <button class="btn-action" data-action="attaque_normale" data-i18n="action_attack">Attaque</button>
        <button class="btn-action" data-action="attaque_special" data-i18n="action_special">Spécial</button>
    </div>

    <!-- ÉCRAN TITRE -->
    <div id="main-menu" class="screen-overlay">
        <h1>BPM Battle</h1>
        
        <!-- MENU PRINCIPAL -->
        <div id="menu-base" class="menu-actions">
            <button id="btn-campaign" class="btn-menu btn-purple inactive" data-i18n="btn_campaign">Campagne / Solo</button>
            <button id="btn-multiplayer" class="btn-menu btn-green" data-i18n="btn_multiplayer">Multijoueur</button>
            <button id="btn-tutorial" class="btn-menu btn-blue" data-i18n="btn_tutorial">Tutoriel</button>
            
            <!-- MENU DE LANGUES -->
            <div id="lang-container">
                <div id="lang-menu" hidden>
                    <button class="lang-option" data-lang="fr">🇫🇷 Français</button>
                    <button class="lang-option" data-lang="en">🇬🇧 English</button>
                    <button class="lang-option" data-lang="zh">🇨🇳 中文</button>
                </div>
                <button id="btn-lang" class="lang-toggle">🇫🇷</button>
            </div>
        </div>

        <!-- MENU MULTIJOUEUR -->
        <div id="menu-multiplayer" class="menu-actions" hidden>
            <button id="btn-host-menu" class="btn-menu btn-green" data-i18n="btn_host">Créer une partie</button>
            <div class="menu-divider" data-i18n="divider">--- OU ---</div>
            <input type="text" id="input-join-code" class="input-code" data-i18n="placeholder_join" placeholder="Code (ex: 1234)">
            <button id="btn-join" class="btn-menu btn-blue" data-i18n="btn_join">Rejoindre</button>
            <div class="menu-divider"></div>
            <button id="btn-perso-menu" class="btn-menu btn-purple" data-i18n="btn_perso">Personnalisation</button>
            
            <button id="btn-back-multiplayer" class="btn-menu btn-blue">
                <svg class="btn-icon-svg icon-portrait" viewBox="0 0 24 24"><use href="#icon-return"></use></svg>
                <span class="text-landscape-only" data-i18n="btn_back">Retour</span>
            </button>
        </div>

        <!-- MENU PERSONNALISATION -->
        <div id="menu-personalization" class="menu-actions" hidden>
            <button id="btn-back-perso-portrait" class="btn-menu btn-blue icon-portrait-only">
                <svg class="btn-icon-svg icon-portrait" viewBox="0 0 24 24"><use href="#icon-return"></use></svg>
            </button>
            
            <h2 data-i18n="title_perso" style="margin: 0 0 15px 0;">Personnalisation</h2>
            
            <!-- Boule du joueur -->
            <div class="player-avatar-preview"></div>
            
            <!-- Types d'attaques -->
            <div class="perso-attack-types">
                <button id="btn-atk-col" class="btn-menu btn-green" data-i18n="btn_atk_col">Colonne</button>
                <button id="btn-atk-row" class="btn-menu btn-green inactive" data-i18n="btn_atk_row">Ligne</button>
            </div>
            
            <!-- Grille 3x3 -->
            <div id="perso-grid-preview" class="grid-preview-3x3">
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
                <div class="grid-cell"></div><div class="grid-cell"></div><div class="grid-cell"></div>
            </div>
            
            <!-- Boutons du bas -->
            <div class="perso-bottom-actions">
                <button id="btn-back-perso-landscape" class="btn-menu btn-blue text-landscape-only">
                    <span data-i18n="btn_back">Retour</span>
                </button>
                <button id="btn-save-perso" class="btn-menu btn-green" data-i18n="btn_save">Sauvegarder</button>
            </div>
        </div>

        <!-- MENU DE CRÉATION DE PARTIE -->
        <div id="menu-settings" class="menu-actions" hidden>
            
            <!-- ZONE PARAMÈTRES -->
            <div id="rules-container" class="settings-scroll-area">
                <h2 style="margin: 0 0 15px 0;" data-i18n="rules_title">Règles du jeu</h2>
                
                <div class="settings-buttons-area" style="margin-bottom: 15px; flex-direction: row; flex-wrap: wrap; justify-content: center;">
                    <button id="btn-preset-1" class="btn-menu btn-green" style="width: auto; padding: 10px;" data-i18n="btn_preset_1">Classique</button>
                    <button id="btn-preset-2" class="btn-menu btn-green inactive" style="width: auto; padding: 10px;" data-i18n="btn_preset_2">BPM Rapide</button>
                    <button id="btn-custom-rules" class="btn-menu btn-green inactive" style="width: 100%; padding: 10px;" data-i18n="btn_custom_rules">Personnaliser</button>
                </div>

                <div id="custom-rules-container" hidden style="width: 100%;">
                    <!-- Paramètres de base -->
                    <div class="setting-group">
                        <label data-i18n="label_hp">Points de vie :</label>
                        <input type="number" id="setting-hp" class="input-code" value="3" min="1" max="10">
                    </div>
                    <div class="setting-group">
                        <label data-i18n="label_atk">Coût Attaque :</label>
                        <input type="number" id="setting-atk" class="input-code" value="1" min="0" max="5">
                    </div>
                    <div class="setting-group">
                        <label data-i18n="label_spe">Coût Spécial :</label>
                        <input type="number" id="setting-spe" class="input-code" value="3" min="0" max="10">
                    </div>
                    <div class="setting-group">
                        <label data-i18n="label_bpm_queue">Taille de la pile :</label>
                        <input type="number" id="setting-bpm-queue" class="input-code" value="0" min="0" max="4">
                    </div>
                    <div class="setting-group" id="setting-queue-detailed-container" hidden>
                        <label data-i18n="label_bpm_queue_detailed">Pile détaillée :</label>
                        <input type="checkbox" id="setting-queue-detailed" style="width: 25px; height: 25px;">
                    </div>
                    
                    <!-- SECTION BPM  -->
                    <hr style="width: 100%; border-color: #555; margin: 10px 0;">
                    
                    <div class="setting-group">
                        <label data-i18n="label_bpm_mode">Mode Rythme (BPM) :</label>
                        <input type="checkbox" id="setting-bpm-mode" style="width: 25px; height: 25px;">
                    </div>
                    
                    <!-- Paramètres BPM -->
                    <div id="bpm-advanced-settings" hidden>
                        <div class="setting-group">
                            <label data-i18n="label_bpm_tempo">Vitesse (ms) :</label>
                            <input type="number" id="setting-bpm-tempo" class="input-code" value="750" min="300" max="3000" step="100">
                        </div>
                    </div>
                    <hr style="width: 100%; border-color: #555; margin: 10px 0;">
                </div>
            </div>

            <!-- ZONE BOUTONS -->
            <div class="settings-buttons-area">
                <button id="btn-ai" class="btn-menu btn-purple" data-i18n="btn_ai">Jouer contre l'IA</button>
                <button id="btn-host-start" class="btn-menu btn-green" data-i18n="btn_host_start">Générer le code PvP</button>
                <p id="room-code-display" class="room-info" hidden></p>
                <button id="btn-back-menu" class="btn-menu btn-blue">
                    <svg class="btn-icon-svg icon-portrait"><use href="#icon-return"></use></svg>
                    <span class="text-landscape-only" data-i18n="btn_back">Retour</span>
                </button>
                
            </div>
            
        </div>
        
        <!-- MENU DES TUTORIELS -->
        <div id="menu-tutorial" class="menu-actions" hidden>
            <h2 style="margin: 0 0 15px 0;" data-i18n="tutorial_title">Tutoriels</h2>
            
            <div class="settings-buttons-area">
                <button id="btn-tut-base" class="btn-menu btn-green" data-i18n="btn_tut_base">Bases du jeu</button>
                <button id="btn-tut-bpm" class="btn-menu btn-purple" data-i18n="btn_tut_bpm">Mode BPM</button>
                
                <hr style="width: 100%; border-color: #555; margin: 10px 0;">
                
                <button id="btn-back-tut" class="btn-menu btn-blue">
                    <svg class="btn-icon-svg icon-portrait"><use href="#icon-return"></use></svg>
                    <span class="text-landscape-only" data-i18n="btn_back">Retour</span>
                </button>
            </div>
        </div>
        
        <div id="version-text"></div>
    </div>

    <!-- ÉCRAN DE FIN -->
    <div id="end-screen" class="screen-overlay" hidden>
        <h1 id="end-message">Victoire !</h1>
        <p id="rematch-waiting-message" hidden data-i18n="waiting_rematch">En attente de l'autre joueur...</p>
        <div id="end-buttons" style="width: 100%; display: flex; flex-direction: column; align-items: center; gap: 15px;">
            <button id="btn-restart" class="btn-menu btn-green" data-i18n="btn_rematch">Rejouer</button>
            <button id="btn-menu-principal" class="btn-menu btn-blue" data-i18n="btn_main_menu">Menu Principal</button>
        </div>
    </div>
    
    <!-- ÉCRAN DE TUTORIEL -->
     <div id="tutorial-box" class="tutorial-box" hidden>
        <p id="tutorial-message">Texte du tuto</p>
    </div>

    <!-- LIBRAIRIES ET SCRIPTS -->
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script type="module" src="js/game.js"></script>
    <!--
    -->
    <!-- Chargement de la variable globale -->
    <script src="./version.js"></script>
    
    <script>
        // Mise à jour de l'affichage HTML
        document.getElementById('version-text').innerText = GAME_VERSION;
    
        // Enregistrement du Service Worker
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./service-worker.js')
            });
        }
    </script>
</body>
</html>
